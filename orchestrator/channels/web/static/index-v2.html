<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUNA · Kontrollraum</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-title" content="LUNA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style-v2.css?v=43">
  <!-- Theme flash-frei (V2 Default: hell). Dunkel nur, wenn Nutzer es fuer V2 explizit waehlt. -->
  <script>(function () {
    var m = localStorage.getItem("luna-v2-theme") || "light";
    var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.add(dark ? "v2-dark" : "v2-light");
  })();</script>
</head>
<body class="v2">
  <div id="v2-bg"><span class="blob b1"></span><span class="blob b2"></span></div>

  <header id="v2-top">
    <button class="v2-icon v2-burger" id="v2-burger" title="Menü" aria-label="Menü öffnen">☰</button>
    <button class="v2-brand" data-go="dash" title="Start">
      <span class="v2-logo"><span></span></span>
      <b>LUNA</b>
    </button>
    <span class="v2-titel-mobil" id="v2-titel-mobil"></span>
    <nav id="v2-nav" class="v2-nav" aria-label="Bereiche"><!-- 4 Bereiche: von app-v2.js gefuellt (modul-gated) --></nav>
    <div class="v2-pills" id="v2-pills"><!-- Aktions-Pills: von app-v2.js gefuellt --></div>
    <div class="v2-topright">
      <button class="v2-zeit-chip" id="v2-zeit-chip" data-act="zt-fenster" title="Zeit läuft – öffnen" hidden>⏱ <span data-zeit-uhr>0:00:00</span></button>
      <button class="v2-icon v2-glocke" id="v2-glocke" data-go="handlung" title="Handlungsbedarf" aria-label="Handlungsbedarf">🔔<span class="v2-zaehler" id="v2-glocke-n" hidden></span></button>
      <button class="v2-icon" id="v2-holo-toggle" title="Orb / Hologramm" hidden>🌙</button>
      <button class="v2-icon" id="v2-theme" title="Hell/Dunkel">☀</button>
      <div class="v2-avatar" id="v2-avatar" title="Profil"></div>
    </div>
  </header>
  <nav id="v2-unter" class="v2-unter" aria-label="Unterbereiche" hidden></nav>
  <div id="v2-schleier" class="v2-schleier" hidden></div>
  <nav id="v2-lade" class="v2-lade" aria-label="Menü" hidden></nav>
  <main id="v2-app"><!-- Dashboard/Sektionen werden von app-v2.js gerendert --></main>

  <!-- LUNA: Orb + Voice-Launcher (UI.md 1a -- bleibt Pflicht, auch in V2) -->
  <button id="v2-orb" class="v2-orb idle" title="Mit LUNA sprechen"><span class="moon"></span></button>
  <!-- LUNA 3D-Hologramm (opt-in; ersetzt den Orb an gleicher Stelle) -->
  <div id="luna-holo" class="luna-holo" title="Mit LUNA sprechen" hidden></div>
  <section id="v2-chat" class="v2-chat" hidden><!-- Inline-Chat-Panel (kein Fenster) --></section>

  <script src="/static/passkey.js?v=1"></script>
  <script src="/static/app-v2.js?v=94"></script>
</body>
</html>
