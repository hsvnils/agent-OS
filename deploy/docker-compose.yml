# LUNA Telegram-Bot auf der Synology (Container Manager / docker compose).
# Pfad anpassen: lege das Repo z. B. unter /volume1/docker/ki-unternehmen ab.
services:
  luna-telegram:
    build: .
    image: luna-telegram:latest
    container_name: luna-telegram
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1     # Logs sofort sichtbar (docker logs)
    volumes:
      # Repo (Code + Daten + .git + orchestrator/.env) in den Container einhaengen.
      - /volume1/docker/ki-unternehmen:/app
    env_file:
      # Stellt die Keys auch in der Prozess-Umgebung bereit (die gebundelte CLI liest ANTHROPIC_API_KEY).
      - /volume1/docker/ki-unternehmen/orchestrator/.env
    restart: unless-stopped

  # Phase 16: LUNA-OS -- Web-Arbeitsoberflaeche (gleiches Image + Volume, anderer Befehl + Port).
  # Erreichbar im LAN unter http://<NAS-IP>:8765 (Login via LUNA_OS_PASSWORD in .env).
  luna-os:
    build: .
    image: luna-telegram:latest
    container_name: luna-os
    working_dir: /app
    command: ["python", "-m", "orchestrator.channels.web"]
    environment:
      - PYTHONUNBUFFERED=1
      - LUNA_OS_HOST=0.0.0.0
      - LUNA_OS_PORT=8765
    ports:
      - "8765:8765"
    volumes:
      - /volume1/docker/ki-unternehmen:/app
      # Reel-Pipeline auf der NAS: Rohvideo-Quelle read-only einhaengen (liegt via Cloud Sync schon auf der NAS).
      # Outbox/State schreibt der Job nach /app/reel_work (Repo-Mount, schon beschreibbar; gitignored/sync-excl).
      # Nightly: docker exec luna-os python -m cutter.reel_daily --source /reelsrc --outbox /app/reel_work/outbox ...
      - /volume1/SocialMediaTeam/Dropbox-Medien/Dateianfragen:/reelsrc:ro
    env_file:
      - /volume1/docker/ki-unternehmen/orchestrator/.env
    restart: unless-stopped

  # NETZ_AGENT_ROADMAP Q1: Netz-Agent in Quarantaene -- einziger Weg fuer freie Websuchen/Seitenabrufe.
  # Sieht NUR seinen eigenen Code (lesend) und die Warteschlange; keine LUNA-Dateien, keine LUNA-.env, kein Port nach aussen.
  luna-netz:
    image: luna-telegram:latest
    container_name: luna-netz
    working_dir: /app
    command: ["python", "-m", "netz_agent"]
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - NETZ_QUEUE=/app/netz_queue
    volumes:
      - /volume1/docker/ki-unternehmen/netz_agent:/app/netz_agent:ro
      - /volume1/docker/ki-unternehmen/netz_queue:/app/netz_queue
    env_file:
      - /volume1/docker/ki-unternehmen/netz_agent/.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped
